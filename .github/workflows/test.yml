name: 接口自动化测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装被测服务依赖
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install flask

      - name: 安装测试依赖
        working-directory: automation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 后台启动被测服务
        working-directory: app
        run: |
          python server.py &
          echo "server PID: $!"
          sleep 3

      - name: 健康检查
        run: |
          curl -fsS http://127.0.0.1:5000/api/products > /dev/null \
            && echo "服务正常" \
            || (echo "服务未就绪"; exit 1)

      - name: 运行 pytest（生成 Allure 结果）
        working-directory: automation
        run: |
          pytest --alluredir=reports/allure-results --clean-alluredir
        continue-on-error: false

      - name: 上传 Allure 原始结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: automation/reports/allure-results
          retention-days: 14

      - name: 生成并发布 Allure HTML 报告
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: automation/reports/allure-results
          allure_history: allure-history
          publish: true
          allure_report_url: ${{ steps.allure_report.outputs.report_url }}

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report
          retention-days: 14