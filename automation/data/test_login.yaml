# 登录接口数据驱动用例（等价类 + 边界值 + 安全）
- case_id: LOGIN-01
  title: 正确用户名密码登录成功
  username: test01
  password: "123456"
  expect_code: 0

- case_id: LOGIN-02
  title: 密码错误
  username: test01
  password: wrong_pw
  expect_code: 1003

- case_id: LOGIN-03
  title: 用户不存在
  username: nobody_2026
  password: "123456"
  expect_code: 1002

- case_id: LOGIN-04a
  title: 用户名为空
  username: ""
  password: "123456"
  expect_code: 1001

- case_id: LOGIN-04b
  title: 密码为空
  username: test01
  password: ""
  expect_code: 1001

- case_id: LOGIN-06
  title: SQL注入尝试
  username: "' or 1=1--"
  password: anything
  expect_code: 1002
